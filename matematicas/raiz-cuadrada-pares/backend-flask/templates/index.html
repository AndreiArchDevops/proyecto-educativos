<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Raíz Cuadrada por Separación de Pares</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <h1>Raíz Cuadrada por Separación de Pares</h1>

    <form method="POST">
        <label>Número:</label>
        <input type="text" name="numero" value="{{ numero }}">
        <button type="submit">Calcular</button>
    </form>

    {% if raiz is not none %}
    <div class="resultado">
        <h2>✅ Raíz cuadrada = {{ raiz }}</h2>
        <h3>Pasos:</h3>
        <ul>
        {% for paso in pasos %}
            <li>{{ paso }}</li>
        {% endfor %}
        </ul>
    </div>
    {% endif %}
</body>
</html>
